<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🌦 Weather Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background: #f7f9fc; }
        h1 { color: #2c3e50; }
        .weather-card { background: #e3f2fd; padding: 15px; margin-top: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input[type="text"] { padding: 8px; width: 70%; border-radius: 4px; border: 1px solid #ccc; }
        button { padding: 8px 15px; margin-left: 10px; border: none; border-radius: 4px; background: #2196f3; color: #fff; cursor: pointer; }
        button:hover { background: #1976d2; }
    </style>
</head>
<body>
    <h1>🌦 Weather Dashboard</h1>
    <p>Enter a city name to get the current weather:</p>
    <input type="text" id="cityInput" placeholder="e.g., London">
    <button onclick="getWeather()">Get Weather</button>

    <div id="weather-container"></div>

    <script>
        function getWeather() {
            const city = document.getElementById('cityInput').value || 'London';
            fetch(`http://localhost:8000/index.php?city=${encodeURIComponent(city)}`)
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById('weather-container');
                    container.innerHTML = ''; // Clear previous results
                    if (data.error) {
                        container.innerHTML = `<div class="weather-card"><p>${data.error}</p></div>`;
                        return;
                    }
                    const card = document.createElement('div');
                    card.className = 'weather-card';
                    card.innerHTML = `
                        <h2>${data.city}</h2>
                        <p><strong>Temperature:</strong> ${data.temperature}°C</p>
                        <p><strong>Condition:</strong> ${data.condition}</p>
                        <p><strong>Humidity:</strong> ${data.humidity}%</p>
                        <p><strong>Wind Speed:</strong> ${data.wind_speed} m/s</p>
                    `;
                    container.appendChild(card);
                })
                .catch(error => {
                    console.error('Fetch error:', error);
                    document.getElementById('weather-container').innerHTML =
                        `<div class="weather-card"><p>Failed to fetch weather data. Backend might be down.</p></div>`;
                });
        }
    </script>
</body>
</html>
